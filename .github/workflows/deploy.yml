name: Deploy to Azure

on:
  push:
    branches: [main]
  # Run the test jobs on PRs too, so red code is caught *before* it merges.
  # The build/deploy stages stay push-only (see `if:` guards below).
  pull_request:
    branches: [main]

concurrency:
  # Keyed per PR so a CI run can never cancel an in-flight production deploy.
  # Pushes to main all share one group, preserving the previous behaviour.
  group: deploy-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  BACKEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/backend
  FRONTEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/frontend
  RESOURCE_GROUP: modelisys-rg
  BACKEND_APP: modelisys-backend
  FRONTEND_APP: modelisys-frontend

jobs:
  # -----------------------------------------------------------------------
  # Stage 1: Test
  # -----------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  # -----------------------------------------------------------------------
  # Stage 2: Build & Push Docker Images
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Never build/push from a PR — only from a merged push to main.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ env.ACR_LOGIN_SERVER }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.BACKEND_IMAGE }}:latest" \
            backend/
          docker push "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.BACKEND_IMAGE }}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_URL=https://api.modelisys.com \
            --build-arg INTERNAL_API_URL=https://modelisys-backend.yellowdune-2ae4f599.eastus.azurecontainerapps.io \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            frontend/
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

  # -----------------------------------------------------------------------
  # Stage 3: Deploy to Azure Container Apps
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            --min-replicas 0 \
            --max-replicas 2

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            --min-replicas 0 \
            --max-replicas 2

      # Real gate: a revision that crash-loops must FAIL the deploy.
      # The old version only printed status, so months of broken deploys
      # reported green while production was down.
      - name: Verify deployments
        run: |
          set -uo pipefail
          check() {
            app="$1"; path="$2"
            fqdn=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP"               --query "properties.configuration.ingress.fqdn" -o tsv)
            for i in $(seq 1 30); do
              latest=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP"                 --query "properties.latestRevisionName" -o tsv)
              ready=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP"                 --query "properties.latestReadyRevisionName" -o tsv)
              if [ "$latest" = "$ready" ]; then
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://$fqdn$path" || echo 000)
                if [ "$code" = "200" ]; then
                  echo "OK: $app healthy (revision $latest, HTTP $code)"
                  return 0
                fi
                echo "  $app: revision $latest ready but $path returned $code"
              else
                echo "  $app: waiting (latest=$latest ready=$ready)"
              fi
              sleep 10
            done
            echo "::error::$app never became healthy - failing the deploy"
            az containerapp logs show -n "$app" -g "$RESOURCE_GROUP"               --tail 60 --type console || true
            return 1
          }
          rc=0
          check "$BACKEND_APP"  /health || rc=1
          check "$FRONTEND_APP" /        || rc=1
          exit $rc
