name: Deploy to Azure

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  BACKEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/backend
  FRONTEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/frontend
  RESOURCE_GROUP: modelisys-rg
  BACKEND_APP: modelisys-backend
  FRONTEND_APP: modelisys-frontend

jobs:
  # -----------------------------------------------------------------------
  # Stage 1: Test
  # -----------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  # -----------------------------------------------------------------------
  # Stage 2: Build & Push Docker Images
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ env.ACR_LOGIN_SERVER }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build and push backend image
        run: |
          # La charte de comptes (MO.xlsx) vit à la racine du dépôt, hors du contexte
          # de build. Sans cette copie, `python -m app.scripts.seed_standard_link_codes`
          # est inexécutable en production : le fichier n'est pas dans l'image.
          # rm -rf d'abord : sinon une seconde exécution imbriquerait backend/data/data.
          rm -rf backend/data
          cp -r data backend/data
          test -f backend/data/MO.xlsx  # échoue tôt plutôt que de livrer une image muette
          docker build \
            -f backend/Dockerfile \
            -t "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.BACKEND_IMAGE }}:latest" \
            backend/
          docker push "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.BACKEND_IMAGE }}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_URL=https://api.modelisys.com \
            --build-arg INTERNAL_API_URL=https://modelisys-backend.yellowdune-2ae4f599.eastus.azurecontainerapps.io \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            frontend/
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

  # -----------------------------------------------------------------------
  # Stage 3: Deploy to Azure Container Apps
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

      # Une image poussée n'est pas une image qui tourne. Quand une révision
      # échoue au démarrage, Container Apps garde silencieusement la précédente :
      # sans ce garde-fou, le pipeline est vert et la production reste figée sur
      # du vieux code. C'est arrivé du 2026-07-26 au 2026-08-01 (variable
      # QBO_TOKEN_ENCRYPTION_KEY absente : le conteneur mourait avant uvicorn).
      - name: Verify deployments
        run: |
          set -uo pipefail

          # Attend qu'une révision devienne saine. Échoue vite si elle a planté,
          # et crache ses logs pour que la cause soit lisible dans le build.
          wait_healthy() {
            app="$1"
            revision=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv)
            if [ -z "$revision" ]; then
              echo "::error::$app : impossible de lire la révision déployée."
              return 1
            fi

            echo "$app → $revision"
            attempt=0
            while [ "$attempt" -lt 40 ]; do
              state=$(az containerapp revision show -n "$app" -g "$RESOURCE_GROUP" \
                --revision "$revision" \
                --query "join(' ', [properties.runningState, properties.healthState])" \
                -o tsv 2>/dev/null || echo "Unknown Unknown")
              running=${state%% *}
              health=${state##* }
              echo "  [$attempt] runningState=$running healthState=$health"

              case "$running" in
                # « Healthy » quand des sondes existent, « None » quand il n'y en a pas :
                # seul « Unhealthy » est un échec avéré.
                Running)
                  if [ "$health" != "Unhealthy" ]; then
                    echo "$app : révision $revision en service."
                    return 0
                  fi
                  ;;
                Failed|Degraded)
                  break
                  ;;
              esac

              attempt=$((attempt + 1))
              sleep 15
            done

            echo "::error::$app : la révision $revision n'est pas entrée en service. \
          L'ancienne révision continue de servir le trafic — la production n'a PAS été mise à jour. \
          Cause la plus fréquente : une variable d'environnement requise manquante \
          (voir app/config.py). Logs du conteneur ci-dessous."
            # `logs show` reste connecté au conteneur : sur une révision qui
            # redémarre en boucle, il ne rend jamais la main. On le borne.
            timeout 60 az containerapp logs show -n "$app" -g "$RESOURCE_GROUP" \
              --revision "$revision" --tail 60 --format text || true
            return 1
          }

          failed=0
          wait_healthy "$BACKEND_APP" || failed=1
          wait_healthy "$FRONTEND_APP" || failed=1
          exit "$failed"
