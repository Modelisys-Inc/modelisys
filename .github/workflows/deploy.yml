name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  FRONTEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/frontend
  RESOURCE_GROUP: modelisys-rg
  FRONTEND_APP: modelisys-frontend

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ env.ACR_LOGIN_SERVER }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build and push frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            frontend/
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            --min-replicas 0 \
            --max-replicas 2

      - name: Verify deployment
        run: |
          set -uo pipefail
          app="$FRONTEND_APP"
          fqdn=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 30); do
            latest=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv)
            ready=$(az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
              --query "properties.latestReadyRevisionName" -o tsv)
            if [ "$latest" = "$ready" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://$fqdn/" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK: $app healthy (revision $latest, HTTP $code)"
                exit 0
              fi
              echo "  $app: revision $latest ready but / returned $code"
            else
              echo "  $app: waiting (latest=$latest ready=$ready)"
            fi
            sleep 10
          done
          echo "::error::$app never became healthy - failing the deploy"
          az containerapp logs show -n "$app" -g "$RESOURCE_GROUP" --tail 60 --type console || true
          exit 1
